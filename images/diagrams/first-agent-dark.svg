<svg viewBox="0 0 1280 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nanoclaw-first-agent-dark-title nanoclaw-first-agent-dark-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="nanoclaw-first-agent-dark-title">What you built: four pieces, one routing rule</title>
  <desc id="nanoclaw-first-agent-dark-desc">Data-flow diagram of the four pieces built in the first-agent tutorial. The channel you type into, the CLI channel running pnpm run chat on cli/local, hands the message to the Local CLI messaging group. A wiring carrying the pattern caret bracket S s close-bracket cout word-boundary sits on the edge between that chat and the Scout agent group, and is what decides whether Scout engages. Scout's session and container pair, backed by groups slash scout and instructions.prepend.md, is drawn with a dashed border because it exists only because you sent a message.</desc>

  <defs>
    <marker id="fa-arrow-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B0B0B0"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Header -->
  <text x="64" y="40" fill="#B0B0B0" font-size="8" letter-spacing="0.18em">NANOCLAW · GUIDES</text>
  <text x="64" y="68" fill="#FFFFFF" font-size="20" font-weight="600" letter-spacing="-0.01em">What you built: four pieces, one routing rule</text>

  <!-- Reading key for the row of chips -->
  <text x="64" y="128" fill="#B0B0B0" font-size="8" letter-spacing="0.14em">EACH BOX · THE PART, THEN WHAT IT IS IN THIS TUTORIAL</text>

  <!-- ==========================================================
       ARROWS — drawn before nodes
       ========================================================== -->
  <path d="M 256,200 H 304" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#fa-arrow-d)"/>
  <path d="M 496,200 H 688" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#fa-arrow-d)"/>
  <path d="M 880,200 H 976" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#fa-arrow-d)"/>

  <!-- ==========================================================
       WIRING — the routing rule, drawn ON the edge it governs
       ========================================================== -->
  <rect x="528" y="176" width="128" height="48" rx="6" fill="#56EDD6" stroke="#56EDD6" stroke-width="1"/>
  <text x="592" y="195" fill="#000000" fill-opacity="0.80" font-size="7" text-anchor="middle" letter-spacing="0.14em">WIRING · PATTERN</text>
  <text x="592" y="213" fill="#000000" font-size="11" font-weight="600" text-anchor="middle">^[Ss]cout\b</text>

  <!-- ==========================================================
       NODES
       ========================================================== -->
  <!-- 1. Channel (external — you, at a terminal) -->
  <rect x="64" y="152" width="192" height="96" rx="6" fill="#202020" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="72" y="168" width="36" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="90" y="177" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="160" y="208" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Channel</text>
  <text x="160" y="228" fill="#B0B0B0" font-size="9" text-anchor="middle">CLI · pnpm run chat · cli/local</text>

  <!-- 2. Messaging group -->
  <rect x="304" y="152" width="192" height="96" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="312" y="168" width="40" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="332" y="177" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">CHAT</text>
  <text x="400" y="208" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Messaging group</text>
  <text x="400" y="228" fill="#B0B0B0" font-size="9" text-anchor="middle">Local CLI</text>

  <!-- 3. Agent group -->
  <rect x="688" y="152" width="192" height="96" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="696" y="168" width="44" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="718" y="177" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="784" y="208" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Agent group</text>
  <text x="784" y="228" fill="#B0B0B0" font-size="9" text-anchor="middle">Scout</text>

  <!-- 4. Session + container (ephemeral — dashed border) -->
  <rect x="976" y="152" width="240" height="96" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="984" y="168" width="56" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="1012" y="177" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
  <text x="1096" y="208" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Session → container</text>
  <text x="1096" y="228" fill="#B0B0B0" font-size="9" text-anchor="middle">groups/scout/ · instructions.prepend.md</text>

  <!-- Editorial aside -->
  <text x="64" y="292" fill="#B0B0B0" font-size="12" font-style="italic">Every channel works through these same four pieces — only the adapter changes.</text>

  <!-- ==========================================================
       LEGEND
       ========================================================== -->
  <line x1="64" y1="324" x2="1216" y2="324" stroke="#3A3A3A" stroke-width="0.8"/>
  <text x="64" y="344" fill="#B0B0B0" font-size="8" letter-spacing="0.18em">LEGEND</text>

  <g font-size="9" fill="#B0B0B0">
    <rect x="64" y="364" width="14" height="10" rx="2" fill="#56EDD6" stroke="#56EDD6" stroke-width="1"/>
    <text x="84" y="372">Wiring — the routing rule between them</text>

    <rect x="336" y="364" width="14" height="10" rx="2" fill="#000000" stroke="#B0B0B0" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="356" y="372">Dashed — created by your first message, torn down when idle</text>
  </g>
</svg>
