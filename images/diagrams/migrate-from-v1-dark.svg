<svg viewBox="0 0 1320 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nanoclaw-migrate-v1-dark-title nanoclaw-migrate-v1-dark-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="nanoclaw-migrate-v1-dark-title">NanoClaw v1 to v2 migration: deterministic first, judgment second</title>
  <desc id="nanoclaw-migrate-v1-dark-desc">Two-lane process diagram of the NanoClaw v1 to v2 migration. The upper lane is migrate-v2.sh, which is deterministic and idempotent: it runs phase 0 prerequisites, phase 1 core state, phase 2 channels and phase 3 infrastructure, then the service switchover. It writes handoff.json, the file that sits between the lanes as the baton. The lower lane is Claude: the /migrate-from-v1 skill reads that file and picks up the judgment calls, then verifies and restarts. Both lanes run inside the v2 checkout, which is the only thing written. The v1 checkout sits outside it and is read only, never written.</desc>

  <defs>
    <marker id="nm-arrow-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B0B0B0"/>
    </marker>
    <marker id="nm-arrow-read-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#B0B0B0" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Header -->
  <text x="64" y="40" fill="#B0B0B0" font-size="8" letter-spacing="0.18em">NANOCLAW · MIGRATION</text>
  <text x="64" y="68" fill="#FFFFFF" font-size="20" font-weight="600" letter-spacing="-0.01em">Deterministic first, judgment second</text>

  <!-- ==========================================================
       V2 CHECKOUT — the boundary everything is written inside
       ========================================================== -->
  <rect x="64" y="240" width="1192" height="488" rx="8" fill="none" stroke="#B0B0B0" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="8,5"/>

  <!-- ==========================================================
       LANES — drawn before arrows and nodes
       ========================================================== -->
  <rect x="88" y="280" width="1144" height="168" rx="8" fill="#181818" stroke="#B0B0B0" stroke-opacity="0.30" stroke-width="0.8"/>
  <rect x="88" y="528" width="1144" height="168" rx="8" fill="#181818" stroke="#B0B0B0" stroke-opacity="0.30" stroke-width="0.8"/>

  <!-- ==========================================================
       ARROWS — drawn before nodes
       ========================================================== -->
  <!-- v1 is read, never written -->
  <path d="M 408,200 V 336" fill="none" stroke="#B0B0B0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#nm-arrow-read-d)"/>
  <!-- phase chain -->
  <path d="M 480,368 H 504" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
  <path d="M 648,368 H 672" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
  <path d="M 816,368 H 840" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
  <path d="M 984,368 H 1008" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
  <!-- the script writes the handoff file -->
  <path d="M 1104,412 V 444" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
  <!-- the skill reads it -->
  <path d="M 1104,524 V 552" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
  <!-- judgment lane runs right to left -->
  <path d="M 1008,600 H 560" fill="none" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>

  <!-- ==========================================================
       ARROW LABELS — masked, clear of the stroke
       ========================================================== -->
  <g font-size="8" letter-spacing="0.08em" fill="#B0B0B0">
    <rect x="416" y="250" width="92" height="12" rx="2" fill="#000000"/>
    <text x="420" y="259">NEVER WRITTEN</text>

    <rect x="1112" y="418" width="48" height="12" rx="2" fill="#181818"/>
    <text x="1116" y="427">PHASE 4</text>

    <rect x="1112" y="532" width="44" height="12" rx="2" fill="#181818"/>
    <text x="1116" y="541">READS</text>
  </g>

  <!-- ==========================================================
       BOUNDARY + LANE LABELS
       ========================================================== -->
  <rect x="88" y="234" width="184" height="12" rx="2" fill="#000000"/>
  <text x="180" y="243" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">V2 CHECKOUT · THE WRITE TARGET</text>

  <rect x="104" y="284" width="248" height="12" rx="2" fill="#181818"/>
  <text x="228" y="293" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">MIGRATE-V2.SH · DETERMINISTIC · IDEMPOTENT</text>

  <rect x="104" y="532" width="112" height="12" rx="2" fill="#181818"/>
  <text x="160" y="541" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">CLAUDE · JUDGMENT</text>

  <!-- Editorial aside -->
  <text x="104" y="492" fill="#B0B0B0" font-size="12" font-style="italic">Idempotent — re-running skips what's done; a failed step never forces a restart.</text>

  <!-- ==========================================================
       NODES
       ========================================================== -->
  <!-- v1 checkout — outside the v2 boundary -->
  <rect x="312" y="112" width="192" height="88" rx="6" fill="#202020" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="320" y="120" width="56" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="348" y="129" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">READ-ONLY</text>
  <text x="408" y="164" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">v1 checkout</text>
  <text x="408" y="182" fill="#B0B0B0" font-size="9" text-anchor="middle">your existing install</text>

  <!-- Phase 0 -->
  <rect x="336" y="336" width="144" height="64" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <text x="408" y="360" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">PHASE 0</text>
  <text x="408" y="380" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">prerequisites</text>

  <!-- Phase 1 -->
  <rect x="504" y="336" width="144" height="64" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <text x="576" y="360" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">PHASE 1</text>
  <text x="576" y="380" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">core state</text>

  <!-- Phase 2 -->
  <rect x="672" y="336" width="144" height="64" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <text x="744" y="360" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">PHASE 2</text>
  <text x="744" y="380" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">channels</text>

  <!-- Phase 3 -->
  <rect x="840" y="336" width="144" height="64" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <text x="912" y="360" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.14em">PHASE 3</text>
  <text x="912" y="380" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">infrastructure</text>

  <!-- Service switchover -->
  <rect x="1008" y="324" width="192" height="88" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="1016" y="332" width="48" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="1040" y="341" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
  <text x="1104" y="376" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">service switchover</text>
  <text x="1104" y="394" fill="#B0B0B0" font-size="9" text-anchor="middle">stop v1 · start v2 · keep or revert</text>

  <!-- handoff.json — the baton between the two actors -->
  <rect x="1008" y="444" width="192" height="80" rx="6" fill="#56EDD6" stroke="#56EDD6" stroke-width="1"/>
  <rect x="1016" y="452" width="36" height="12" rx="2" fill="none" stroke="#000000" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="1034" y="461" fill="#000000" fill-opacity="0.80" font-size="7" text-anchor="middle" letter-spacing="0.08em">FILE</text>
  <text x="1104" y="492" fill="#000000" font-size="12" font-weight="600" text-anchor="middle">handoff.json</text>
  <text x="1104" y="510" fill="#000000" fill-opacity="0.72" font-size="9" text-anchor="middle">per-step results · follow-ups</text>

  <!-- /migrate-from-v1 skill -->
  <rect x="1008" y="552" width="192" height="96" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="1016" y="560" width="40" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="1036" y="569" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="1104" y="604" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">/migrate-from-v1</text>
  <text x="1104" y="622" fill="#B0B0B0" font-size="9" text-anchor="middle">picks up the judgment calls</text>

  <!-- verify + restart -->
  <rect x="336" y="552" width="224" height="96" rx="6" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="344" y="560" width="44" height="12" rx="2" fill="none" stroke="#B0B0B0" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="366" y="569" fill="#B0B0B0" font-size="7" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
  <text x="448" y="604" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">verify + restart</text>
  <text x="448" y="622" fill="#B0B0B0" font-size="9" text-anchor="middle">end-to-end health check · service restart</text>

  <!-- ==========================================================
       LEGEND
       ========================================================== -->
  <line x1="64" y1="776" x2="1256" y2="776" stroke="#3A3A3A" stroke-width="0.8"/>
  <text x="64" y="796" fill="#B0B0B0" font-size="8" letter-spacing="0.18em">LEGEND</text>

  <g font-size="9" fill="#B0B0B0">
    <rect x="64" y="816" width="14" height="10" rx="2" fill="#56EDD6" stroke="#56EDD6" stroke-width="1"/>
    <text x="84" y="824">Handoff file · the baton</text>

    <rect x="224" y="816" width="14" height="10" rx="2" fill="#000000" stroke="#B0B0B0" stroke-width="1"/>
    <text x="244" y="824">Step run by that lane's actor</text>

    <line x1="424" y1="820" x2="452" y2="820" stroke="#B0B0B0" stroke-width="1.2" marker-end="url(#nm-arrow-d)"/>
    <text x="460" y="824">Sequence</text>

    <line x1="552" y1="820" x2="580" y2="820" stroke="#B0B0B0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#nm-arrow-read-d)"/>
    <text x="588" y="824">Read · v1 is never written</text>
  </g>
</svg>
