<svg viewBox="0 0 1360 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nanoclaw-channels-title nanoclaw-channels-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="nanoclaw-channels-title">NanoClaw channels: trunk ships the infrastructure, adapters install on demand</title>
  <desc id="nanoclaw-channels-desc">Architecture diagram of the NanoClaw channel system. Your install ships channel infrastructure on trunk: the adapter interface and channel registry, the Chat SDK bridge, the webhook server, and one built-in cli channel that needs no credentials. Platform adapters such as telegram, discord, slack and whatsapp sit in a catalog on the channels branch and are not in your install; an install path adds one into a dashed, empty channel slot named slash-add-channel. An installed adapter connects to its platform and registers with the channel registry. Separately, a wiring links a messaging group, meaning a chat, channel or thread, to an agent group, and the same chat can be wired to several agents.</desc>

  <defs>
    <marker id="nc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5C5349"/>
    </marker>
    <marker id="nc-arrow-mint" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0F756D"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="64" y="40" fill="#5C5349" font-size="8" letter-spacing="0.18em">NANOCLAW · CHANNELS</text>
  <text x="64" y="68" fill="#1A1612" font-size="20" font-weight="600" letter-spacing="-0.01em">Trunk ships the infrastructure; channels install on demand</text>

  <!-- ==========================================================
       ZONES — drawn before arrows and nodes
       ========================================================== -->
  <!-- catalog shelf (off trunk) -->
  <rect x="64" y="112" width="992" height="96" rx="8" fill="#FAF5EA" stroke="#8A8178" stroke-opacity="0.35" stroke-width="0.8"/>
  <!-- your install -->
  <rect x="64" y="296" width="992" height="368" rx="8" fill="#FAF5EA" stroke="#8A8178" stroke-opacity="0.35" stroke-width="0.8"/>
  <!-- wiring -->
  <rect x="64" y="704" width="992" height="128" rx="8" fill="#FAF5EA" stroke="#8A8178" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- ==========================================================
       ARROWS — drawn before nodes
       ========================================================== -->
  <!-- install path: catalog -> slot -->
  <path d="M 648,208 V 360" fill="none" stroke="#0F756D" stroke-width="1.6" marker-end="url(#nc-arrow-mint)"/>
  <!-- platform -> installed adapter -->
  <path d="M 1120,408 H 776" fill="none" stroke="#5C5349" stroke-width="1.2" marker-end="url(#nc-arrow)"/>
  <!-- installed adapter -> registry -->
  <path d="M 560,456 V 480 Q 560,488 552,488 H 352 Q 344,488 344,496 V 520" fill="none" stroke="#5C5349" stroke-width="1.2" marker-end="url(#nc-arrow)"/>
  <!-- built-in cli -> registry -->
  <path d="M 240,456 V 520" fill="none" stroke="#5C5349" stroke-width="1.2" marker-end="url(#nc-arrow)"/>
  <!-- wiring edge: messaging group -> agent group (chip sits between the segments) -->
  <path d="M 408,780 H 508" fill="none" stroke="#5C5349" stroke-width="1.2"/>
  <path d="M 612,780 H 712" fill="none" stroke="#5C5349" stroke-width="1.2" marker-end="url(#nc-arrow)"/>

  <!-- ==========================================================
       ARROW LABELS — masked, 8-12px clear of the stroke
       ========================================================== -->
  <g font-size="8" letter-spacing="0.08em" fill="#5C5349">
    <rect x="656" y="268" width="116" height="12" rx="2" fill="#FFFFFF"/>
    <text x="660" y="277" fill="#0F756D">INSTALLED ON DEMAND</text>

    <rect x="896" y="386" width="104" height="12" rx="2" fill="#FAF5EA"/>
    <text x="948" y="395" text-anchor="middle">PLATFORM EVENTS</text>

    <rect x="392" y="466" width="120" height="12" rx="2" fill="#FAF5EA"/>
    <text x="452" y="475" text-anchor="middle">REGISTERS ON IMPORT</text>
  </g>

  <!-- ==========================================================
       ZONE LABELS, BAND EYEBROWS, ZONE NOTES
       ========================================================== -->
  <rect x="80" y="116" width="172" height="12" rx="2" fill="#FAF5EA"/>
  <text x="84" y="125" fill="#5C5349" font-size="7" letter-spacing="0.14em">CHANNELS BRANCH · CATALOG</text>
  <text x="1040" y="125" fill="#5C5349" font-size="7" text-anchor="end" letter-spacing="0.14em">NOT IN YOUR INSTALL UNTIL YOU ADD IT</text>

  <rect x="80" y="300" width="148" height="12" rx="2" fill="#FAF5EA"/>
  <text x="84" y="309" fill="#5C5349" font-size="7" letter-spacing="0.14em">YOUR INSTALL · TRUNK</text>

  <text x="96" y="344" fill="#5C5349" font-size="7" letter-spacing="0.14em">CHANNELS</text>
  <text x="96" y="504" fill="#5C5349" font-size="7" letter-spacing="0.14em">CHANNEL INFRASTRUCTURE</text>

  <rect x="80" y="708" width="264" height="12" rx="2" fill="#FAF5EA"/>
  <text x="84" y="717" fill="#5C5349" font-size="7" letter-spacing="0.14em">WIRING · WHICH AGENT HANDLES WHICH CHAT</text>
  <text x="1040" y="717" fill="#5C5349" font-size="7" text-anchor="end" letter-spacing="0.14em">INSTALLING A CHANNEL STARTS THE MESSAGES · WIRING DECIDES WHO ANSWERS</text>

  <!-- Editorial aside -->
  <text x="800" y="442" fill="#5C5349" font-size="12" font-style="italic">Replies leave through the same adapter.</text>

  <!-- ==========================================================
       WIRING EDGE CHIP — rides the connector
       ========================================================== -->
  <rect x="508" y="768" width="104" height="24" rx="4" fill="#FAF5EA" stroke="#8A8178" stroke-width="1"/>
  <text x="560" y="784" fill="#1A1612" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.12em">WIRING</text>
  <text x="560" y="808" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.14em">MANY TO MANY</text>

  <!-- ==========================================================
       NODES
       ========================================================== -->
  <!-- Catalog: adapters that do not ship on trunk -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="132" y="148" width="152" height="40" rx="6" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
    <text x="208" y="173" fill="#1A1612">telegram</text>

    <rect x="308" y="148" width="152" height="40" rx="6" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
    <text x="384" y="173" fill="#1A1612">discord</text>

    <rect x="484" y="148" width="152" height="40" rx="6" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
    <text x="560" y="173" fill="#1A1612">slack</text>

    <rect x="660" y="148" width="152" height="40" rx="6" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
    <text x="736" y="173" fill="#1A1612">whatsapp</text>

    <rect x="836" y="148" width="152" height="40" rx="6" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
    <text x="912" y="173" fill="#5C5349">…</text>
  </g>

  <!-- Built-in cli channel -->
  <rect x="128" y="360" width="224" height="96" rx="6" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
  <rect x="136" y="368" width="52" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="162" y="377" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">BUILT-IN</text>
  <text x="240" y="406" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">cli</text>
  <text x="240" y="424" fill="#5C5349" font-size="9" text-anchor="middle">local terminal · no credentials</text>

  <!-- Channel slot — empty until an /add-&lt;channel&gt; skill fills it -->
  <rect x="520" y="360" width="256" height="96" rx="6" fill="#1FB8B0" fill-opacity="0.08" stroke="#0F756D" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="528" y="368" width="40" height="12" rx="2" fill="none" stroke="#0F756D" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="548" y="377" fill="#0F756D" font-size="7" text-anchor="middle" letter-spacing="0.08em">SLOT</text>
  <text x="648" y="406" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">/add-&lt;channel&gt;</text>
  <text x="648" y="424" fill="#5C5349" font-size="9" text-anchor="middle">empty until you install one</text>

  <!-- Platform (external) -->
  <rect x="1120" y="360" width="176" height="96" rx="6" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
  <rect x="1128" y="368" width="36" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="1146" y="377" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="1208" y="406" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">Platform</text>
  <text x="1208" y="424" fill="#5C5349" font-size="9" text-anchor="middle">the chat service</text>

  <!-- Adapter interface + channel registry -->
  <rect x="128" y="520" width="288" height="112" rx="6" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
  <rect x="136" y="528" width="40" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="156" y="537" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="272" y="568" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">Adapter interface + registry</text>
  <text x="272" y="588" fill="#5C5349" font-size="9" text-anchor="middle">instantiates adapters at startup</text>
  <text x="272" y="604" fill="#5C5349" font-size="9" text-anchor="middle">resolves the adapter for delivery</text>

  <!-- Chat SDK bridge -->
  <rect x="496" y="528" width="224" height="96" rx="6" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
  <rect x="504" y="536" width="40" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="524" y="545" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="608" y="586" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">Chat SDK bridge</text>

  <!-- Webhook server -->
  <rect x="776" y="528" width="224" height="96" rx="6" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
  <rect x="784" y="536" width="40" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="804" y="545" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="888" y="586" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">Webhook server</text>

  <!-- Messaging group -->
  <rect x="144" y="744" width="264" height="72" rx="6" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
  <rect x="152" y="752" width="40" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="172" y="761" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">CHAT</text>
  <text x="276" y="784" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">Messaging group</text>
  <text x="276" y="800" fill="#5C5349" font-size="9" text-anchor="middle">a chat, channel, or thread</text>

  <!-- Agent group -->
  <rect x="712" y="744" width="264" height="72" rx="6" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
  <rect x="720" y="752" width="44" height="12" rx="2" fill="none" stroke="#8A8178" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="742" y="761" fill="#5C5349" font-size="7" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="844" y="784" fill="#1A1612" font-size="12" font-weight="600" text-anchor="middle">Agent group</text>
  <text x="844" y="800" fill="#5C5349" font-size="9" text-anchor="middle">the agents that answer</text>

  <!-- ==========================================================
       LEGEND
       ========================================================== -->
  <line x1="64" y1="880" x2="1296" y2="880" stroke="#E7E0D3" stroke-width="0.8"/>
  <text x="64" y="900" fill="#5C5349" font-size="8" letter-spacing="0.18em">LEGEND</text>

  <g font-size="9" fill="#5C5349">
    <rect x="64" y="916" width="14" height="10" rx="2" fill="#1FB8B0" fill-opacity="0.08" stroke="#0F756D" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="84" y="924">Channel slot · empty until installed</text>

    <rect x="320" y="916" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#8A8178" stroke-width="1"/>
    <text x="340" y="924">Ships on trunk</text>

    <rect x="464" y="916" width="14" height="10" rx="2" fill="#F2EBD7" stroke="#8A8178" stroke-width="1"/>
    <text x="484" y="924">Not on trunk · catalog entry or platform</text>

    <line x1="704" y1="921" x2="732" y2="921" stroke="#0F756D" stroke-width="1.6" marker-end="url(#nc-arrow-mint)"/>
    <text x="740" y="924">Install path · /add-&lt;channel&gt;</text>

    <line x1="912" y1="921" x2="940" y2="921" stroke="#5C5349" stroke-width="1.2" marker-end="url(#nc-arrow)"/>
    <text x="948" y="924">Registers · connects</text>
  </g>
</svg>
